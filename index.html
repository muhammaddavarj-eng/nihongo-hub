function getFavorites(){try{return JSON.parse(localStorage.getItem('nihongoFavs')||'[]')}catch(e){return []}}
function saveFavorite(item){let f=getFavorites();const key=item.key;if(f.some(x=>x.key===key))f=f.filter(x=>x.key!==key);else f.push(item);localStorage.setItem('nihongoFavs',JSON.stringify(f));renderToast(f.some(x=>x.key===key)?'Ditambahkan ke favorit ⭐':'Dihapus dari favorit');if(currentPage==='favorites')renderPage('favorites')}
function isFav(key){return getFavorites().some(x=>x.key===key)}
function renderToast(msg){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}
function pageHeader(title,desc){return `<div class="page-title"><div class="eyebrow">NIHONGO HUB / BELAJAR</div><h2>${title}</h2><p>${desc}</p></div>`}
function card(icon,title,desc,page){return `<article class="lesson-card" data-go="${page}"><div class="lesson-top"><div class="lesson-icon">${icon}</div><span class="mini-link">PELAJARI ↗</span></div><h4>${title}</h4><p>${desc}</p><span class="mini-link">Buka materi →</span></article>`}
function kanaPage(type){const isH=type==='hiragana',data=isH?kanaH:kanaK,title=isH?'Hiragana':'Katakana',subtitle=isH?'Huruf dasar untuk kata asli Jepang dan unsur tata bahasa.':'Huruf yang sering digunakan untuk kata serapan, nama asing, dan penekanan.';return pageHeader(title,subtitle)+`<div class="toolbar"><button class="chip active" data-kana-filter="all">Semua (${data.length})</button><button class="chip" data-kana-filter="basic">Dasar</button><button class="chip" data-kana-filter="dakuten">Dakuten / handakuten</button><button class="chip" data-kana-filter="combo">Kombinasi</button></div><div class="kana-grid" id="kanaGrid">${data.map((x,i)=>`<div class="kana" data-kind="${i<46?'basic':i<71?'dakuten':'combo'}"><strong>${x[0]}</strong><span>${x[1]}</span><small>${isFav(type+'-'+x[0])?'★ Favorit':''}</small><button class="text-btn" style="margin-top:7px" data-fav-kana="${type}|${x[0]}|${x[1]}">${isFav(type+'-'+x[0])?'★':'☆'}</button></div>`).join('')}</div><div class="note">Tips: pelajari 5–10 huruf setiap hari. Untuk dakuten dan kombinasi, perhatikan perubahan bunyi seperti か (ka) → が (ga), serta きゃ (kya). Klik ☆ untuk menyimpan karakter favorit.</div>`}
function vocabPage(searchTerm=''){let list=vocab.filter(v=>v.join(' ').toLowerCase().includes(searchTerm.toLowerCase()));return pageHeader('Kosakata Jepang','Kumpulan kosakata awal dengan kanji, hiragana, romaji, dan arti bahasa Indonesia.')+`<div class="toolbar"><input id="vocabSearch" class="search" style="width:100%;max-width:340px" placeholder="Cari Jepang, romaji, atau arti..." value="${escapeHtml(searchTerm)}"><button class="chip active" data-vocab-filter="Semua">Semua</button>${['Sekolah','Makanan','Kata sifat','Tempat','Waktu','Benda','Orang','Alam'].map(c=>`<button class="chip" data-vocab-filter="${c}">${c}</button>`).join('')}</div><div class="word-list" id="wordList">${list.map(v=>wordCard(v)).join('')||'<div class="empty">Kosakata tidak ditemukan.</div>'}</div><div class="note">Daftar ini adalah kumpulan awal untuk latihan. Baca kanji bersama cara baca dan contoh kata; satu kanji bisa memiliki beberapa bacaan tergantung konteks.</div>`}
function wordCard(v){let key='vocab-'+v[0];return `<div class="word"><div class="jp">${v[0]}</div><div>${v[1]}</div><div class="romaji">${v[2]}</div><div class="meaning">${v[3]}</div><button data-fav-word="${encodeURIComponent(JSON.stringify({key,jp:v[0],reading:v[1],romaji:v[2],meaning:v[3]}))}">${isFav(key)?'★ Tersimpan':'☆ Favorit'}</button></div>`}
function verbsPage(){return pageHeader('Kata Kerja','Kenali bentuk kamus, bentuk sopan -masu, negatif, te-form, dan bentuk lampau.')+`<div class="toolbar"><input id="verbSearch" class="search" style="width:100%;max-width:340px" placeholder="Cari kata kerja..."><button class="chip active" data-verb-filter="Semua">Semua</button>${['Golongan 1','Golongan 2','Tidak beraturan'].map(c=>`<button class="chip" data-verb-filter="${c}">${c}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>Arti</th><th>Bentuk kamus</th><th>-masu</th><th>Nai (negatif)</th><th>Te-form</th><th>Ta-form</th></tr></thead><tbody id="verbRows">${verbs.map((v,i)=>verbRow(v,i)).join('')}</tbody></table></div><div class="note"><strong>Catatan:</strong> bentuk kata kerja perlu dipelajari berdasarkan golongannya. Ada kata kerja golongan 1 yang berakhiran る, jadi jangan menentukan golongan hanya dari akhiran る. Contoh: 帰る (kaeru) termasuk golongan 1.</div>`}
function verbRow(v,i){return `<tr data-verb-kind="${v[4]}" data-verb-text="${v.join(' ').toLowerCase()}"><td>${v[3]} <button class="text-btn" data-fav-verb="${i}">${isFav('verb-'+v[0])?'★':'☆'}</button></td><td class="jp">${v[0]}<div style="font-size:10px;color:#718096;font-weight:400">${v[1]} · ${v[2]}</div></td><td class="jp">${v[5]}</td><td class="jp">${v[6]}</td><td class="jp">${v[7]}</td><td class="jp">${v[8]}</td></tr>`}
function kanjiPage(){return pageHeader('Kanji Dasar','Mulai dari kanji yang sering muncul dalam kosakata dan materi pemula.')+`<div class="grid">${kanji.map(k=>`<article class="lesson-card"><div class="lesson-top"><div class="lesson-icon" style="font-size:29px">${k[0]}</div><button class="text-btn" data-fav-kanji="${encodeURIComponent(JSON.stringify({key:'kanji-'+k[0],jp:k[0],reading:k[1],romaji:k[2],meaning:k[3]}))}">${isFav('kanji-'+k[0])?'★':'☆'}</button></div><h4>${k[3]}</h4><p><strong>Bacaan:</strong> ${k[1]}<br><strong>Romaji:</strong> ${k[2]}<br><strong>Contoh:</strong> ${k[4]}</p></article>`).join('')}</div><div class="note">Onyomi biasanya berasal dari pembacaan Tionghoa yang diadaptasi ke bahasa Jepang; kunyomi adalah pembacaan asli Jepang. Bacaan tepat bergantung pada kata.</div>`}
function grammarPage(){return pageHeader('Tata Bahasa','Pola kalimat pemula sampai beberapa pola lanjutan. Baca contoh, romaji, dan artinya.')+`<div class="grid">${grammar.map((g,i)=>`<article class="lesson-card"><div class="lesson-top"><div class="lesson-icon">文</div><button class="text-btn" data-fav-grammar="${i}">${isFav('grammar-'+i)?'★':'☆'}</button></div><h4>${g[0]}</h4><p><strong>${g[1]}</strong><br>${g[2]}<br><br><span style="font-size:17px;color:#17263f">${g[3]}</span><br><em>${g[4]}</em></p></article>`).join('')}</div><div class="note">Ini ringkasan, bukan seluruh tata bahasa Jepang. Perhatikan konteks, tingkat kesopanan, dan perubahan kata kerja saat naik level.</div>`}
function conversationPage(){return pageHeader('Percakapan Sehari-hari','Ungkapan praktis untuk salam, perkenalan, dan situasi sehari-hari.')+`<div class="toolbar"><button class="chip active" data-conv-filter="Semua">Semua</button>${['Salam','Perkenalan','Sehari-hari'].map(x=>`<button class="chip" data-conv-filter="${x}">${x}</button>`).join('')}</div><div class="grid" id="convGrid">${conversations.map((c,i)=>convCard(c,i)).join('')}</div>`}

function jlptPage(){return pageHeader('Jalur Belajar JLPT','Pilih level sesuai kemampuanmu. Ini peta belajar; materi akan ditambah bertahap.')+`<div class="grid">${[

function quizPage(){if(!quizOrder.length)quizOrder=quizBank.map((_,i)=>i).sort(()=>Math.random()-.5);if(quizIndex>=quizOrder.length)return pageHeader('Hasil Kuis','Bagus, kamu sudah menyelesaikan satu putaran latihan!')+`<div class="quiz-box" style="text-align:center"><div style="font-size:55px">🎉</div><h2>Kuis selesai!</h2><p>Skor kamu: <strong>${quizScore} / ${quizOrder.length}</strong></p><p style="color:#718096;font-size:13px">Coba ulangi kuis untuk melatih ingatan.</p><button class="primary" id="restartQuiz">Ulangi kuis</button></div>`;let q=quizBank[quizOrder[quizIndex]];return pageHeader('Kuis Interaktif','Uji pemahamanmu dengan pertanyaan acak seputar huruf, kosakata, kanji, dan tata bahasa.')+`<div class="quiz-box"><div class="quiz-count">PERTANYAAN ${quizIndex+1} DARI ${quizOrder.length} <span style="float:right">Skor: ${quizScore}</span></div><div class="quiz-progress"><div style="width:${quizIndex/quizOrder.length*100}%"></div></div><div class="quiz-question"><div class="big">${q.q.includes('あ')?'あ':q.q.includes('シ')?'シ':q.q.includes('日')?'日':'?'}</div><h3>${q.q}</h3></div><div class="options">${q.choices.map(c=>`<button class="option" data-answer="${escapeHtml(c)}">${c}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="primary hidden" id="nextQuestion">${quizIndex===quizOrder.length-1?'Lihat hasil':'Pertanyaan berikutnya →'}</button></div>`}

<div class="stats"><div class="stat"><div class="stat-icon">あ</div><div><strong>46+</strong><small>Huruf dasar</small></div></div><div class="stat"><div class="stat-icon">📚</div><div><strong>${vocab.length}</strong><small>Kosakata awal</small></div></div><div class="stat"><div class="stat-icon">漢</div><div><strong>${kanji.length}</strong><small>Kanji pengantar</small></div></div><div class="stat"><div class="stat-icon">✎</div><div><strong>${done}</strong><small>Kuis selesai</small></div></div></div>
<div class="section-head"><div><h3>Jelajahi materi</h3><p>Pilih topik yang mau kamu pelajari.</p></div><button class="text-btn" data-go="jlpt">Lihat jalur JLPT →</button></div><div class="grid">${card('あ','Hiragana','Kenali huruf dasar, dakuten, dan kombinasi.','hiragana')}${card('ア','Katakana','Belajar huruf untuk kata serapan dan nama asing.','katakana')}${card('漢','Kanji','Pelajari arti dan cara baca kanji pemula.','kanji')}${card('📚','Kosakata','Tambah kata baru lengkap dengan romaji dan arti.','vocab')}${card('⚡','Kata kerja','Pelajari bentuk masu, nai, te, dan ta.','verbs')}${card('文','Tata bahasa','Susun kalimat Jepang dengan pola yang benar.','grammar')}</div>
<div class="section-head"><div><h3>Kosakata hari ini</h3><p>Ingat 3 kata berikut sebagai latihan awal.</p></div><button class="text-btn" data-go="vocab">Lihat semua →</button></div><div class="word-list">${[vocab[1],vocab[2],vocab[34]].map(wordCard).join('')}</div><div class="panel"><div class="panel-head"><h3>🎯 Tantang dirimu</h3><span class="mini-link">LATIHAN CEPAT</span></div><p style="font-size:13px;color:#718096;line-height:1.7">Uji ingatanmu dengan kuis acak. Coba jawab tanpa melihat catatan, lalu pelajari kembali jawaban yang keliru.</p><button class="primary" data-go="quiz">Mulai kuis →</button></div><div class="footer">Nihongo Hub · Belajar bahasa Jepang dengan konsisten 毎日少しずつ</div>`}
function renderPage(page){currentPage=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=pages[page]||'Beranda';$('#sidebar').classList.remove('open');if(page==='home')content.innerHTML=homePage();else if(page==='hiragana'||page==='katakana')content.innerHTML=kanaPage(page);else if(page==='vocab')content.innerHTML=vocabPage();else if(page==='verbs')content.innerHTML=verbsPage();else if(page==='kanji')content.innerHTML=kanjiPage();else if(page==='grammar')content.innerHTML=grammarPage();else if(page==='conversation')content.innerHTML=conversationPage();else if(page==='jlpt')content.innerHTML=jlptPage();else if(page==='favorites')content.innerHTML=favoritesPage();else if(page==='quiz')content.innerHTML=quizPage();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-page]');if(nav){renderPage(nav.dataset.page);return}
 const go=e.target.closest('[data-go]');if(go){renderPage(go.dataset.go);return}
 const k=e.target.closest('[data-fav-kana]');if(k){let [type,char,roma]=k.dataset.favKana.split('|');saveFavorite({key:type+'-'+char,jp:char,reading:roma,meaning:type==='hiragana'?'Hiragana':'Katakana'});k.textContent=isFav(type+'-'+char)?'★':'☆';return}
 const w=e.target.closest('[data-fav-word]');if(w){let item=JSON.parse(decodeURIComponent(w.dataset.favWord));saveFavorite(item);w.textContent=isFav(item.key)?'★ Tersimpan':'☆ Favorit';return}
 const fk=e.target.closest('[data-fav-kanji]');if(fk){saveFavorite(JSON.parse(decodeURIComponent(fk.dataset.favKanji)));renderPage('kanji');return}
 const fv=e.target.closest('[data-fav-verb]');if(fv){let v=verbs[Number(fv.dataset.favVerb)];saveFavorite({key:'verb-'+v[0],jp:v[0],reading:v[1],romaji:v[2],meaning:v[3]});renderPage('verbs');return}
 const fg=e.target.closest('[data-fav-grammar]');if(fg){let i=Number(fg.dataset.favGrammar),g=grammar[i];saveFavorite({key:'grammar-'+i,jp:g[0],reading:g[1],meaning:g[2]});renderPage('grammar');return}
 const fc=e.target.closest('[data-fav-conv]');if(fc){let i=Number(fc.dataset.favConv),c=conversations[i];saveFavorite({key:'conv-'+i,jp:c[1],reading:c[2],meaning:c[3]});renderPage('conversation');return}
 const rm=e.target.closest('[data-remove-fav]');if(rm){let key=decodeURIComponent(rm.dataset.removeFav);localStorage.setItem('nihongoFavs',JSON.stringify(getFavorites().filter(x=>x.key!==key)));renderPage('favorites');return}
 const filter=e.target.closest('[data-kana-filter]');if(filter){filter.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b===filter));document.querySelectorAll('.kana').forEach(el=>el.classList.toggle('hidden',filter.dataset.kanaFilter!=='all'&&el.dataset.kind!==filter.dataset.kanaFilter));return}
 const vf=e.target.closest('[data-vocab-filter]');if(vf){document.querySelectorAll('[data-vocab-filter]').forEach(b=>b.classList.toggle('active',b===vf));let c=vf.dataset.vocabFilter;$('#wordList').innerHTML=vocab.filter(v=>(c==='Semua'||v[4]===c)&&v.join(' ').toLowerCase().includes(($('#vocabSearch')?.value||'').toLowerCase())).map(wordCard).join('')||'<div class="empty">Kosakata tidak ditemukan.</div>';return}
 const verbf=e.target.closest('[data-verb-filter]');if(verbf){document.querySelectorAll('[data-verb-filter]').forEach(b=>b.classList.toggle('active',b===verbf));document.querySelectorAll('[data-verb-kind]').forEach(r=>r.classList.toggle('hidden',verbf.dataset.verbFilter!=='Semua'&&r.dataset.verbKind!==verbf.dataset.verbFilter));return}
 const cf=e.target.closest('[data-conv-filter]');if(cf){document.querySelectorAll('[data-conv-filter]').forEach(b=>b.classList.toggle('active',b===cf));document.querySelectorAll('[data-conv-kind]').forEach(r=>r.classList.toggle('hidden',cf.dataset.convFilter!=='Semua'&&r.dataset.convKind!==cf.dataset.convFilter));return}
 const ans=e.target.closest('[data-answer]');if(ans&&!answered){answered=true;let q=quizBank[quizOrder[quizIndex]],correct=ans.dataset.answer===q.answer;if(correct)quizScore++;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.answer)b.classList.add('correct');else if(b===ans)b.classList.add('wrong')});$('#feedback').textContent=(correct?'Betul! 🎉 ':'Belum tepat. ') + q.tip;$('#nextQuestion').classList.remove('hidden');return}
 if(e.target.id==='nextQuestion'){quizIndex++;answered=false;renderPage('quiz');return}
 if(e.target.id==='restartQuiz'){quizIndex=0;quizScore=0;quizOrder=[];localStorage.setItem('nihongoQuizDone',Number(localStorage.getItem('nihongoQuizDone')||0)+1);renderPage('quiz');return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='vocabSearch'){let q=e.target.value;$('#wordList').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(q.toLowerCase())).map(wordCard).join('')||'<div class="empty">Kosakata tidak ditemukan.</div>'}
 if(e.target.id==='verbSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-verb-text]').forEach(r=>r.classList.toggle('hidden',!r.dataset.verbText.includes(q)))}
 if(e.target.id==='globalSearch'){let q=e.target.value.trim();if(q.length>1){renderPage('vocab');$('#vocabSearch').value=q;$('#wordList').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(q.toLowerCase())).map(wordCard).join('')||'<div class="empty">Kosakata tidak ditemukan.</div>'}}
});
$('#menuToggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>$('#globalSearch').value=''));
renderPage('home');
</script>
</body>
</html>
